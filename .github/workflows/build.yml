name: Build OBSMV Plugin

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Configure CMake
        run: |
          cmake -B windows/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Plugin
        run: |
          cmake --build windows/build --config Release -j

      - name: Package Plugin
        run: |
          mkdir -p package/obs-plugins/64bit
          mkdir -p package/data/obs-plugins/obsmv
          cp windows/build/obsmv.dll package/obs-plugins/64bit/
          cp -r data/* package/data/obs-plugins/obsmv/
          Compress-Archive -Path package/* -DestinationPath obsmv-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsmv-windows-x64
          path: obsmv-windows-x64.zip

  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++ pkg-config libdbus-1-dev libobs-dev

      - name: Configure CMake
        run: |
          cmake -B linux/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Plugin
        run: |
          cmake --build linux/build -j

      - name: Package Plugin
        run: |
          mkdir -p package/obs-plugins/
          mkdir -p package/data/obs-plugins/obsmv/
          cp linux/build/obsmv.so package/obs-plugins/
          cp -r data/* package/data/obs-plugins/obsmv/
          tar -czf obsmv-linux-x86_64.tar.gz -C package .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsmv-linux-x86_64
          path: obsmv-linux-x86_64.tar.gz

  build-macos:
    name: macOS Universal
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -B macos/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build Plugin
        run: |
          cmake --build macos/build -j

      - name: Package Plugin
        run: |
          mkdir -p package/obs-plugins/
          mkdir -p package/data/obs-plugins/obsmv/
          cp macos/build/obsmv.so package/obs-plugins/ 2>/dev/null || cp macos/build/obsmv.dylib package/obs-plugins/obsmv.so
          cp -r data/* package/data/obs-plugins/obsmv/
          tar -czf obsmv-macos-universal.tar.gz -C package .

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsmv-macos-universal
          path: obsmv-macos-universal.tar.gz

